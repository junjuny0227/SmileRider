name: Deploy

on:
  push:
    branches:
      - main

permissions:
  contents: read

# 배포가 겹치면 이전 배포는 취소한다
concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # pnpm 버전은 package.json의 packageManager 필드에서 읽음
      - uses: pnpm/action-setup@v6
        with:
          run_install: false

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile
      - run: pnpm exec nx run-many -t lint test typecheck build

      # GitHub Actions에서 빌드하고 결과물만 Cloudflare Pages에 올린다 (기획 7장 배포)
      - run: pnpm dlx wrangler@4.151.3 pages deploy apps/game/dist --project-name=smilerider --branch=main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
