name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  main:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # pnpm 버전은 package.json의 packageManager 필드에서 읽음
      - uses: pnpm/action-setup@v6
        with:
          run_install: false

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile
      - run: pnpm exec nx run-many -t lint test typecheck build

      # E2E: 키보드 모드 자동 주행으로 시작부터 결과 화면까지 (기획 10.7)
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm exec nx e2e @winkrider/game-e2e
